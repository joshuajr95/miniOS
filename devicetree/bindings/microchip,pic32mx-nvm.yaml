# DT binding for the PIC32MX series flash memory controller
#
# Author: Joshua Jacobs-Rebhun
# Date: April 8, 2026

title: Binding for the PIC32MX flash memory controller

compatible: "microchip,pic32mx-nvm"


properties:

  reg:
    type: array
    required: true
    description: Base address and memory size for the flash controller register block

  status:
    type: string
    required: true
    description: Status of the flash controller
    enum:
      - "okay"
      - "disabled"
      - "fail"

